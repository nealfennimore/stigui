name: Schedule
on:
    schedule:
        - cron: '0 0 * * *'

jobs:
    schedule:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            actions: write

        steps:
            - name: Checkout code
              uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

            - name: STIG URL
              run: |
                  . scripts/get-stig-url.sh
                  echo "URL=$URL" >> "$GITHUB_ENV"

            # DISA publishes the quarterly library on its own timetable, so a
            # missing URL is expected — skip the run instead of failing it
            - name: Check STIG library availability
              id: available
              run: |
                  if curl -o /dev/null -fsL --retry 3 -r 0-0 "$URL"; then
                      echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "available=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::STIG library not published yet: $URL"
                  fi

            - name: Retrieve the cached "data" directory (if present)
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              id: data-cache
              if: steps.available.outputs.available == 'true'
              with:
                  path: ./data
                  key: ${{ env.URL }}

            - name: Download STIG data
              run: . scripts/fetch-stigs.sh
              if: steps.available.outputs.available == 'true' && steps.data-cache.outputs.cache-hit != 'true'

            - name: Create JSON STIG data
              run: . scripts/create-json-stigs.sh
              if: steps.available.outputs.available == 'true' && steps.data-cache.outputs.cache-hit != 'true'

            - name: Set version tag
              id: versions
              if: steps.available.outputs.available == 'true' && steps.data-cache.outputs.cache-hit != 'true'
              run: |
                  TAG="${URL##*/}"
                  TAG="stig-release-${TAG%.zip}"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
              if: steps.available.outputs.available == 'true' && steps.data-cache.outputs.cache-hit != 'true'

            - name: Create Release
              if: steps.available.outputs.available == 'true' && steps.data-cache.outputs.cache-hit != 'true'
              uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
              with:
                  tag_name: ${{ steps.versions.outputs.tag }}

            # Tags created with the default GITHUB_TOKEN don't trigger the
            # deploy workflow's push event, so dispatch it explicitly
            - name: Trigger GitHub Pages deploy
              if: steps.available.outputs.available == 'true' && steps.data-cache.outputs.cache-hit != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run deploy.yml --ref main
